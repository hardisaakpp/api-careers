# api-careers as a long-running container: restarts by itself. Host networking because the AI service listens
# on 127.0.0.1 and SQL Server publishes 1433 on the host. Copy .env.example to .env first.
#   docker compose up -d --build
services:
  api:
    build: .
    image: api-careers:local
    restart: unless-stopped
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development} # Development creates/updates the database on start
      ASPNETCORE_URLS: http://127.0.0.1:${CAREERS_API_PORT:-5190}
      ConnectionStrings__Default: "Server=${SQL_HOST:-localhost,1433};Database=${CAREERS_DB:-careers};User Id=sa;Password=${SQL_PASSWORD:?set SQL_PASSWORD in .env};TrustServerCertificate=true"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env} # the same key api-stockline signs with: one sign-in for the whole product
      Ai__BaseUrl: ${AI_URL:-http://127.0.0.1:8930/}
      Ai__ApiKey: ${CAREERS_AI_KEY:?set CAREERS_AI_KEY in .env}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${CAREERS_API_PORT:-5190} && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 30s
      timeout: 3s
      start_period: 40s
